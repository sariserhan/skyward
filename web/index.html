<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#09141c"/><meta name="description" content="Explore live reported aircraft, estimated flight routes, and mapped airport gates and runways on an interactive satellite globe."/><title>Skyward · Flight observatory</title><link rel="manifest" href="/watch/manifest.json"/><link rel="apple-touch-icon" href="/watch/icon-192.png"/><link rel="icon" type="image/svg+xml" href="/watch/favicon.svg"/><style>.startup-skeleton{margin:24px 0}.startup-skeleton i{display:block;height:16px;margin:16px 0;border-radius:6px;background:linear-gradient(90deg,#234350,#365765,#234350);background-size:200% 100%;animation:startup-shimmer 1.7s linear infinite}.startup-skeleton i:nth-child(2){width:70%}.startup-skeleton i:nth-child(3){height:62px}.startup-failed .startup-skeleton{display:none}@keyframes startup-shimmer{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.startup-skeleton i{animation:none}}</style></head><body style="margin:0;background:#09141c"><div id="root"><main id="startup" style="font:16px system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:28px;color:#edf4f6;background:#102330;border-radius:12px"><a href="/" style="color:#b4f3dc;text-decoration:none;letter-spacing:.2em;font-size:13px">SKYWARD</a><h1 id="startup-title" style="font-size:28px">Preparing your view</h1><p id="startup-message" role="status" aria-live="polite">Loading your view and flight controls…</p><div class="startup-skeleton" aria-hidden="true"><i></i><i></i><i></i></div><p><a style="color:#8fdfc8" href="">Reload</a> · <a style="color:#8fdfc8" href="/healthz" target="_blank" rel="noopener">Check server connection</a></p></main></div><script>
(function(){
 var timer,root=document.getElementById('root');
 function status(message){var el=document.getElementById('startup-message');if(el)el.textContent=message;}
 function failed(event){if(event.target&&event.target.tagName==='SCRIPT'||event instanceof ErrorEvent){clearTimeout(timer);root.classList.add('startup-failed');var title=document.getElementById('startup-title');if(title)title.textContent='Unable to open Skyward';status(!navigator.onLine?'You appear to be offline. Reconnect, then reload to continue.':'An application file could not load. Please check your connection and reload.');}}
 window.addEventListener('error',failed,true);
 timer=setTimeout(function(){status('This is taking longer than expected. Check your connection, then reload to try again.');},20000);
 var observer=new MutationObserver(function(){if(!document.getElementById('startup')){clearTimeout(timer);window.removeEventListener('error',failed,true);observer.disconnect();}});observer.observe(root,{childList:true});
})();
</script><noscript>Skyward needs JavaScript to display the interactive map and aircraft observations.</noscript><script type="module" src="/src/main.tsx"></script></body></html>
