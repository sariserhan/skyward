<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#09141c"/><meta name="description" content="Explore live reported aircraft, estimated flight routes, and mapped airport gates and runways on an interactive satellite globe."/><title>Skyward · Flight observatory</title><link rel="manifest" href="/watch/manifest.json"/><link rel="apple-touch-icon" href="/watch/icon-192.png"/><link rel="icon" type="image/svg+xml" href="/watch/favicon.svg"/></head><body style="margin:0;background:#09141c"><div id="root"><main id="startup" style="font:16px system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:28px;color:#edf4f6;background:#102330;border-radius:12px"><h1 style="font-size:25px">Opening Skyward…</h1><p id="startup-message">Downloading the flight observatory. The first visit can take longer over a forwarded connection.</p><p><a style="color:#8fdfc8" href="/">Reload</a> · <a style="color:#8fdfc8" href="/healthz" target="_blank" rel="noopener">Check server connection</a></p></main></div><script>
(function(){
 var timer,root=document.getElementById('root');
 function status(message){var el=document.getElementById('startup-message');if(el)el.textContent=message;}
 function failed(event){if(event.target&&event.target.tagName==='SCRIPT')status(!navigator.onLine?'Skyward is offline. Required app files are not cached. Reconnect to the server and reload; no new traffic is available.':'An application file could not load. Reload, or use Check server connection to test the forwarded port.');}
 window.addEventListener('error',failed,true);
 timer=setTimeout(function(){status('Still waiting for application files. Use Check server connection: if that also hangs, reconnect the forwarded port. If it responds, try reloading this page.');},20000);
 var observer=new MutationObserver(function(){if(!document.getElementById('startup')){clearTimeout(timer);window.removeEventListener('error',failed,true);observer.disconnect();}});observer.observe(root,{childList:true});
})();
</script><noscript>Skyward needs JavaScript to display the interactive map and aircraft observations.</noscript><script type="module" src="/src/main.tsx"></script></body></html>
